---
# basic image item layout
# Displays the item image directly on the page.
layout: item/item-page-base
---

<div class="card mb-4 text-center">

    <img src="{{ page.image_small | default: page.object_location | relative_url }}"
         alt="{{ page.image_alt_text | default: page.title | escape }}"
         class="img-fluid mx-auto">

    <div class="card-body">

        {% include item/download-buttons.html %}

    </div>

</div>
